name: Release

# Publication to npm (docs/agents/build.md, «Версии пакетов»). Only the merge
# of a release PR publishes: a `release/…` branch (a merge commit) or a PR
# «Выпуск …» (squash). A check that a version is missing from npm is not
# enough on its own: a version never released (0.1.0) would go out with any
# push.
on:
  push:
    branches: [main]

# Two merges in a row do not publish one version twice.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    outputs:
      channel: ${{ steps.channel.outputs.value }}
    name: Публикация в npm
    if: contains(github.event.head_commit.message, 'release/') || startsWith(github.event.head_commit.message, 'Выпуск ')
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags and the GitHub Release
      id-token: write # npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Канал выпуска
        id: channel
        run: |
          channel=$(node tools/release-notes/cli.mjs channel)
          echo "value=$channel" >> "$GITHUB_OUTPUT"

      # Every package is checked at its own version: the library shares one,
      # each theme and icon pack has its own. None missing from npm — a rerun
      # after a successful publication, nothing to do. The list goes to a file
      # and not through a pipe: the step shell has no `pipefail`, and a failed
      # check would read as «nothing to publish».
      - name: Что не опубликовано?
        id: check
        run: |
          node tools/release-notes/cli.mjs unpublished > "$RUNNER_TEMP/unpublished.txt"
          cat "$RUNNER_TEMP/unpublished.txt"
          if [ -s "$RUNNER_TEMP/unpublished.txt" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.publish == 'true'
        run: npm ci

      - if: steps.check.outputs.publish == 'true'
        name: Сборка пакетов
        run: npm run build

      - if: steps.check.outputs.publish == 'true'
        name: Импорты пакетов объявлены
        run: npm run check:published-imports

      # The approved plan was validated against every unpublished package above.
      - if: steps.check.outputs.publish == 'true'
        name: Публикация
        run: npx changeset publish --tag "${{ steps.channel.outputs.value }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.SOXA_NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # Each scope has its own GitHub history, including a coordinated stable graduation.
      - name: Теги и GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin --tags
          node tools/release-notes/cli.mjs planned > "$RUNNER_TEMP/planned.txt"
          node tools/release-notes/cli.mjs release "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA" "$GITHUB_SHA" < "$RUNNER_TEMP/planned.txt"

  verify:
    name: Установка опубликованного выпуска
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # SolidStart in the registry smoke matrix requires Node 24.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Chromium для проверки страниц
        run: npx playwright install --with-deps chromium

      # Registry mode installs the published release channel without packing
      # or resolving any library source from this checkout.
      - name: Установка из npm в чистые проекты
        run: npm run check:install -- --registry "${{ needs.publish.outputs.channel }}"
